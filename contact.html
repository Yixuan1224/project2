
<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Scent Archive</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <header class="site-header">
        <nav class="navbar md:navbar-expand">
            <div class="container-fluid">
                <a class="navbar-brand" href="index.html">Scent Archive</a>

                <div class="nav-right">
                    <dialog class="drawer drawer-end" id="menu"
                        tabindex="-1" aria-labelledby="menuTitle">
                        <div class="drawer-header">
                            <h2 class="drawer-title" id="menuTitle">Menu</h2>
                            <button class="btn-close" type="button"
                                data-bs-dismiss="drawer" aria-label="Close menu"></button>
                        </div>

                        <div class="drawer-body">
                            <ul class="navbar-nav">
                                <li class="nav-item">
                                    <a class="nav-link" href="index.html">Home</a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" href="detail.html">Details</a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link active" aria-current="page" href="contact.html">Contact</a>
                                </li>
                            </ul>
                        </div>
                    </dialog>

                    <button type="button" id="theme" aria-pressed="false">Dark mode</button>
                    <span id="saved" aria-live="polite">Saved: 0</span>

                    <button class="btn-icon navbar-toggler" type="button"
                        data-bs-toggle="drawer" data-bs-target="#menu"
                        aria-controls="menu" aria-expanded="false" aria-label="Open menu">
                        <span class="navbar-toggler-icon" aria-hidden="true"></span>
                    </button>
                </div>
            </div>
        </nav>
    </header>

    <main class="container">
        <section class="contact">
            <h1>Contact Us</h1>
            <p>Have a question? Send us a message.</p>

            <form id="contactForm" novalidate>
                <div class="row g-4">

                    <div class="col-12 md:col-6">
                        <div class="form-field">
                            <label for="firstName" class="form-label">First Name</label>
                            <input type="text" id="firstName" class="form-control" required>
                            <p class="error" id="firstError"></p>
                        </div>
                    </div>

                    <div class="col-12 md:col-6">
                        <div class="form-field">
                            <label for="lastName" class="form-label">Last Name</label>
                            <input type="text" id="lastName" class="form-control" required>
                            <p class="error" id="lastError"></p>
                        </div>
                    </div>

                    <div class="col-12">
                        <div class="form-field">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" id="email" class="form-control" required>
                            <p class="error" id="emailError"></p>
                        </div>
                    </div>

                    <div class="col-12">
                        <div class="form-field">
                            <label for="topic" class="form-label">Topic</label>
                            <select id="topic" class="form-control" required>
                                <option value="">Select a topic</option>
                                <option value="question">General Question</option>
                                <option value="story">Share a Story</option>
                                <option value="feedback">Feedback</option>
                            </select>
                            <p class="error" id="topicError"></p>
                        </div>
                    </div>

                    <div class="col-12">
                        <div class="form-field">
                            <label for="message" class="form-label">Message</label>
                            <textarea id="message" class="form-control" rows="5" required></textarea>
                            <p id="charCount" aria-live="polite">0 characters</p>
                            <p class="error" id="messageError"></p>
                        </div>
                    </div>

                    <div class="col-12">
                        <div class="form-field">
                            <input type="checkbox" id="consent" class="check" required>
                            <label for="consent">I agree to be contacted about my message.</label>
                            <p class="error" id="consentError"></p>
                        </div>
                    </div>

                    <div class="col-12">
                        <button type="submit" class="btn-solid theme-primary">Send</button>
                    </div>

                </div>
            </form>

            <p id="confirmation" aria-live="polite" hidden></p>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Scent Archive</p>

        <nav class="footer-links">
            <a href="index.html">Home</a>
            <a href="detail.html">Details</a>
            <a href="contact.html">Contact</a>
        </nav>
    </footer>

    <script type="module" src="js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>

</body>
</html>
